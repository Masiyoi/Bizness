    <script>
      // Pesapal's redirect sometimes drops the URL fragment (#/checkout)
      // entirely when it appends its own OrderTrackingId query param,
      // landing us on a bare "/?OrderTrackingId=xxx" with no hash -- which
      // HashRouter can't route (it falls through to "/"). Catch that here,
      // before the app bundle even loads, and rewrite it into the hash
      // shape the router expects.
      (function () {
        var search = window.location.search;
        if (search && !window.location.hash && /OrderTrackingId=/.test(search)) {
          window.location.replace(window.location.pathname + '#/checkout' + search);
        }
      })();
    </script>

    <style id="initial-loader-style">
      #initial-loader {
        position: fixed;
        inset: 0;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #initial-loader .spinner-ring {
        position: relative;
        width: 170px;
        height: 170px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #initial-loader .spinner-ring::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 4px solid #e5e5e5;
        border-top-color: #4FC3F7;
        animation: initial-loader-spin 1s linear infinite;
      }
      #initial-loader .spinner-ring img {
        width: 130px;
        height: 130px;
        border-radius: 50%;
        object-fit: contain;
        background: #ffffff;
      }
      @keyframes initial-loader-spin {
        to { transform: rotate(360deg); }
      }
      #initial-loader.fade-out {
        opacity: 0;
        pointer-events: none;
      }
    </style>

  <body>
    <div id="initial-loader">
      <div class="spinner-ring">
        <img src="/plugwalk.jpg" alt="Loading" />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var MIN_DISPLAY_MS = 2000;
        var startTime = Date.now();
        var removed = false;
        function hideLoader() {
          if (removed) return;
          var loader = document.getElementById('initial-loader');
          if (!loader) return;
          removed = true;
          loader.classList.add('fade-out');
          setTimeout(function () { loader.remove(); }, 300);
        }
        function removeLoader() {
          var elapsed = Date.now() - startTime;
          var remaining = MIN_DISPLAY_MS - elapsed;
          if (remaining > 0) {
            setTimeout(hideLoader, remaining);
          } else {
            hideLoader();
          }
        }
        var root = document.getElementById('root');
        var observer = new MutationObserver(function () {
          if (root.childNodes.length > 0) {
            observer.disconnect();
            removeLoader();
          }
        });
        observer.observe(root, { childList: true });
        // Fallback in case the observer never fires
        window.addEventListener('load', function () {
          setTimeout(removeLoader, 4000);
        });
      })();
    </script>
